# Flujo de trabajo para publicar el sitio estático en GitHub Pages.
name: Desplegar en GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Subir el sitio (se excluyen pruebas y archivos de desarrollo del artefacto)
        run: |
          mkdir _site
          cp -r index.html admin.html pantalla.html css js img data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4

